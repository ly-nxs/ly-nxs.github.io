<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>
    <style>
        /* Insert styles here, this is called an internal stylesheet  */
        @import url('https://googleapis.com');


        body {
            background: #FFECD7;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #008db1;
            border-radius: 8px;
            border: 5px solid #004e63;
            text-align: center;
            color: #91e4fb;
            font-family: Helvetica;
            
        }

        .img-card {
            max-width: 100%;
            height: 300px;
            
            margin-top: 20px;
            border: 5px solid #fff;
        }

        .h1 {
            color: #fff;
        }

        .ul{
            color: #fff;
            display: inline-block;
        }
        a {
            color: #91e4fb;
            text-decoration: none;
        }
        .p {
            color: #ffd783;
            font-style: italic;
            font-family: 'Nanum Brush Script', cursive;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="h1">Dallin H. Oaks</h1>
        <h5 class="h5"><a href="https://churchofjesuschrist.org" target="_blank">18th President of the Church of Jesus Christ of Latter-day Saints</a></h5>
        <img src="../prophet_cards/images/oaks.webp" alt="Dallin H. Oaks" class="img-card">
        <ul class="ul">
           <li>Born: August 12, 1932</li>
            <li>Apostle: April 7, 1984</li>
            <li>Prophet: October 14, 2025</li>
        </ul>
        <p class="p"><strong>"The Lord did not make it easy, but He made it possible."</strong></p>
    </div>
</body>
</html>
