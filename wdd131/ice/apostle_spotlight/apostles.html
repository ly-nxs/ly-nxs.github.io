<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body {
            background-color:#E8ECED;
            font-family: Arial, Helvetica, sans-serif;
        }

        .main-container {
            border: 5px solid #000;
            border-radius: 10px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
            color: #FFF;
            background-image: url('https://www.churchofjesuschrist.org/imgs/79db72fdbc5691b382b58b18f2b36b0e64524d9c/full/!1200,/0/default');
            max-width: 1000px;
        }

    .grid1 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0px;
        margin-top: 20px;
        justify-items: center;
        align-items: center;
        margin-left: 200px;
        margin-right: 200px;
    }       

    .second-counselor {
        border: 5px solid #fff;
        border-radius: 50%;
        max-height: 100px;
        max-width: 100px;
    }

    .apostle {
        border: 5px solid #fff;
        border-radius: 50%;
        max-height: 80px;
        max-width: 80px;
    }

    .prophet {
        border: 5px solid #fff;
        border-radius: 50%;
        max-height: 120px;
        max-width: 120px;
    }


    img{
        aspect-ratio: 1 / 1;   /* Forces the image to be a perfect square */
        object-fit: cover;  
        transition: all 0.5s ease-in-out;
    }
    img:hover{
        transform: scale(1.1) ;
        border-color: rgb(192, 199, 255);
    }

    .grid2 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
       gap: 20px;
        margin-top: 20px;
        justify-items: center;
        align-items: center;
        margin-left: 200px;
        margin-right: 200px;
    }
    </style>
</head>
<body>
   <div class="main-container">
        <h1>First Presidency</h1>
        <div class="grid1">
            <img src="images/eyring.webp" class="second-counselor" alt="Henry B. Eyring">
            <img src="images/oaks.webp" class="prophet" alt="Dallin H. Oaks">
            <img src="images/christofferson.webp" class="second-counselor" alt="D.Todd Christofferson">
        </div>
        <h2>Quorum of the Twelve Apostles</h2>
        <div class="grid2">
            <img src="images/uchtdorf.webp" class="apostle" alt="Dieter F. Uchtdorf">
            <img src="images/bednar.webp" class="apostle" alt="David A. Bednar">
            <img src="images/cook.webp" class="apostle" alt="Quentin L. Cook">
            <img src="images/anderson.webp" class="apostle" alt="Neil L. Anderson">
            <img src="images/rasband.webp" class="apostle" alt="Ronald A. Rasband">
            <img src="images/stevenson.webp" class="apostle" alt="Gary E. Stevenson">
            <img src="images/renlund.webp" class="apostle" alt="Dale G. Renlund">
            <img src="images/gong.webp" class="apostle" alt="Gerrit W.Gong">
            <img src="images/soares.webp" class="apostle" alt="Ulisses Soares">
            <img src="images/kearon.webp" class="apostle" alt="Patrick Kearon">
            <img src="images/causse.webp" class="apostle" alt="Gerald Causse">
            <img src="images/gilbert.webp" class="apostle" alt="Clark G. Gilbert">
        </div>
   </div>
</body>
</html>
